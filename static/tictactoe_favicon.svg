<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Grid Lines -->
  <line x1="24" y1="12" x2="24" y2="52" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="12" x2="40" y2="52" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="24" x2="52" y2="24" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="40" x2="52" y2="40" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Neon X -->
  <g filter="url(#neonGlow)">
    <line x1="14" y1="14" x2="22" y2="22" stroke="#00F0FF" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="14" x2="14" y2="22" stroke="#00F0FF" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Neon O -->
  <g filter="url(#neonGlow)">
    <circle cx="46" cy="46" r="4.5" fill="none" stroke="#FF007F" stroke-width="3"/>
  </g>
  <!-- Winning Strike -->
  <line x1="14" y1="46" x2="46" y2="14" stroke="#00F5A0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3"/>
</svg>
