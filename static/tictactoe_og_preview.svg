<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="cyanOrb" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkOrb" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0"/>
    </radialGradient>
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#cyanOrb)"/>
  <rect width="1200" height="630" fill="url(#pinkOrb)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left: Branding & Meta -->
  <g transform="translate(100, 160)">
    <rect width="210" height="38" rx="19" fill="#1E293B" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="20" cy="19" r="6" fill="#00F5A0"/>
    <text x="36" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">PRODUCTION READY</text>

    <text x="0" y="110" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
      TicTacToe <tspan fill="#00F0FF">Pro</tspan>
    </text>
    <text x="0" y="160" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500">
      Unbeatable Minimax AI • Real-Time Stats • Zero Dependencies
    </text>

    <!-- Checklist Badges -->
    <g transform="translate(0, 210)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#0F172A" stroke="#334155"/>
      <text x="14" y="23" fill="#00F5A0">✓ GDPR Privacy</text>

      <rect x="175" y="0" width="160" height="36" rx="8" fill="#0F172A" stroke="#334155"/>
      <text x="189" y="23" fill="#00F5A0">✓ Rate Limited</text>

      <rect x="350" y="0" width="160" height="36" rx="8" fill="#0F172A" stroke="#334155"/>
      <text x="364" y="23" fill="#00F5A0">✓ Mobile PWA</text>
    </g>
  </g>

  <!-- Right: 3x3 Gaming Board Preview with Glowing Glyphs -->
  <g transform="translate(740, 115)">
    <rect width="360" height="360" rx="24" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="2"/>
    <!-- Board Grid -->
    <line x1="120" y1="20" x2="120" y2="340" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="240" y1="20" x2="240" y2="340" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="120" x2="340" y2="120" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="240" x2="340" y2="240" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

    <!-- Cell (0,0): Neon X -->
    <g filter="url(#ogGlow)">
      <line x1="40" y1="40" x2="80" y2="80" stroke="#00F0FF" stroke-width="8" stroke-linecap="round"/>
      <line x1="80" y1="40" x2="40" y2="80" stroke="#00F0FF" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Cell (1,1): Neon X -->
    <g filter="url(#ogGlow)">
      <line x1="160" y1="160" x2="200" y2="200" stroke="#00F0FF" stroke-width="8" stroke-linecap="round"/>
      <line x1="200" y1="160" x2="160" y2="200" stroke="#00F0FF" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Cell (2,2): Neon X -->
    <g filter="url(#ogGlow)">
      <line x1="280" y1="280" x2="320" y2="320" stroke="#00F0FF" stroke-width="8" stroke-linecap="round"/>
      <line x1="320" y1="280" x2="280" y2="320" stroke="#00F0FF" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Cell (0,2): Neon O -->
    <g filter="url(#ogGlow)">
      <circle cx="300" cy="60" r="24" fill="none" stroke="#FF007F" stroke-width="8"/>
    </g>

    <!-- Cell (2,0): Neon O -->
    <g filter="url(#ogGlow)">
      <circle cx="60" cy="300" r="24" fill="none" stroke="#FF007F" stroke-width="8"/>
    </g>

    <!-- Winning Diagonal Beam -->
    <line x1="30" y1="30" x2="330" y2="330" stroke="#00F5A0" stroke-width="6" stroke-linecap="round" filter="url(#ogGlow)"/>
  </g>
</svg>
