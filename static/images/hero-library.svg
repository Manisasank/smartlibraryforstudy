<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E3E62" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADB5"/>
      <stop offset="100%" stop-color="#088395"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A261"/>
      <stop offset="100%" stop-color="#E5A93B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Isometric Floor Grid -->
  <polygon points="300,50 560,190 300,330 40,190" fill="url(#skyGrad)" stroke="#00ADB5" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="300" y1="50" x2="300" y2="330" stroke="#00ADB5" stroke-opacity="0.15" stroke-dasharray="4"/>
  <line x1="170" y1="120" x2="430" y2="260" stroke="#00ADB5" stroke-opacity="0.15" stroke-dasharray="4"/>
  <line x1="430" y1="120" x2="170" y2="260" stroke="#00ADB5" stroke-opacity="0.15" stroke-dasharray="4"/>

  <!-- Left Bookshelf Stack -->
  <g transform="translate(100, 110)">
    <!-- Base -->
    <path d="M 0,90 L 60,60 L 140,105 L 80,135 Z" fill="#1E3E62"/>
    <path d="M 0,90 L 80,135 L 80,240 L 0,195 Z" fill="#0B192C"/>
    <path d="M 80,135 L 140,105 L 140,210 L 80,240 Z" fill="#162E4A"/>
    <!-- Shelf Dividers -->
    <path d="M 10,130 L 70,165 L 130,135" stroke="#00ADB5" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 10,170 L 70,205 L 130,175" stroke="#00ADB5" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- Books on Shelf -->
    <rect x="25" y="105" width="12" height="35" rx="2" fill="url(#tealGrad)" transform="skewY(22)"/>
    <rect x="42" y="98" width="10" height="38" rx="2" fill="url(#goldGrad)" transform="skewY(22)"/>
    <rect x="56" y="94" width="14" height="34" rx="2" fill="#E2E8F0" transform="skewY(22)"/>
    <rect x="74" y="88" width="11" height="39" rx="2" fill="#3B82F6" transform="skewY(22)"/>
    
    <rect x="25" y="145" width="13" height="36" rx="2" fill="url(#goldGrad)" transform="skewY(22)"/>
    <rect x="42" y="138" width="12" height="35" rx="2" fill="#10B981" transform="skewY(22)"/>
    <rect x="58" y="133" width="10" height="38" rx="2" fill="url(#tealGrad)" transform="skewY(22)"/>
    <rect x="72" y="128" width="15" height="34" rx="2" fill="#EC4899" transform="skewY(22)"/>
  </g>

  <!-- Central Digital Hub / Tablet / Book Portal -->
  <g transform="translate(230, 160)">
    <!-- Base Platform -->
    <ellipse cx="70" cy="140" rx="90" ry="35" fill="#00ADB5" opacity="0.2" filter="url(#glow)"/>
    
    <!-- Open Book Top -->
    <path d="M 70,70 Q 20,40 -20,65 L -20,115 Q 20,90 70,120 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M 70,70 Q 120,40 160,65 L 160,115 Q 120,90 70,120 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Book Spine & Binding -->
    <line x1="70" y1="70" x2="70" y2="120" stroke="#00ADB5" stroke-width="3"/>
    
    <!-- Floating Digital Screen / Tablet -->
    <g transform="translate(15, -40)">
      <rect x="0" y="0" width="110" height="75" rx="8" fill="#0B192C" stroke="url(#tealGrad)" stroke-width="2.5" filter="url(#glow)"/>
      <!-- Screen UI elements -->
      <rect x="10" y="12" width="40" height="6" rx="3" fill="#00ADB5"/>
      <rect x="10" y="24" width="70" height="4" rx="2" fill="#94A3B8" opacity="0.6"/>
      <rect x="10" y="32" width="60" height="4" rx="2" fill="#94A3B8" opacity="0.6"/>
      <rect x="10" y="40" width="80" height="4" rx="2" fill="#94A3B8" opacity="0.6"/>
      <!-- Checkmark / Success Badge on Screen -->
      <circle cx="85" cy="20" r="9" fill="url(#goldGrad)"/>
      <path d="M 81,20 L 84,23 L 89,17" stroke="#0B192C" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Screen Button -->
      <rect x="10" y="52" width="45" height="12" rx="4" fill="url(#tealGrad)"/>
      <circle cx="55" cy="70" r="2.5" fill="#64748B"/>
    </g>

    <!-- Floating Sparkles & Data Dots -->
    <circle cx="-10" cy="30" r="4" fill="url(#goldGrad)" filter="url(#glow)"/>
    <circle cx="150" cy="35" r="3.5" fill="#00ADB5" filter="url(#glow)"/>
    <circle cx="30" cy="-20" r="2.5" fill="#00ADB5"/>
    <circle cx="130" cy="-10" r="3" fill="url(#goldGrad)"/>
    <line x1="70" y1="20" x2="70" y2="60" stroke="#00ADB5" stroke-dasharray="3" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Right Knowledge Pillar / Stack of Books -->
  <g transform="translate(420, 160)">
    <!-- Book 1 (Bottom) -->
    <path d="M 0,70 L 45,45 L 115,80 L 70,105 Z" fill="#088395"/>
    <path d="M 0,70 L 70,105 L 70,120 L 0,85 Z" fill="#00ADB5"/>
    <path d="M 70,105 L 115,80 L 115,95 L 70,120 Z" fill="#056676"/>

    <!-- Book 2 (Middle) -->
    <path d="M 5,50 L 50,25 L 110,60 L 65,85 Z" fill="#E5A93B"/>
    <path d="M 5,50 L 65,85 L 65,97 L 5,62 Z" fill="#F4A261"/>
    <path d="M 65,85 L 110,60 L 110,72 L 65,97 Z" fill="#D4AF37"/>

    <!-- Book 3 (Top) -->
    <path d="M 12,30 L 55,5 L 105,40 L 62,65 Z" fill="#2C5282"/>
    <path d="M 12,30 L 62,65 L 62,75 L 12,40 Z" fill="#1E3E62"/>
    <path d="M 62,65 L 105,40 L 105,50 L 62,75 Z" fill="#0B192C"/>
  </g>
</svg>
